# Streamlit configuration.
#
# The UI is built for ONE dark look: the wallpaper sits behind a dark scrim and every
# block is a translucent dark "glass" panel whose colours come from the theme variables.
# Pinning the theme here keeps widgets (inputs, selects, sliders) in the same palette as
# those panels, and it also removes the light/dark switch from the app menu.
[theme]
base = "dark"
# The dataframe's checkboxes and every other widget accent (buttons, sliders, focus
# rings, the strip cursor, the active tab) use this colour. Reverted to the original
# blue: white made the selected tab's label white-on-white, because page.css paints
# the active tab with var(--primary-color).
primaryColor = "#3b82f6"
